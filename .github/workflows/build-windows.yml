name: windows-build

# PrintEXE Windows build, test, package, and release automation.
#
# Triggers:
#   - Pull request targeting main (build + test only; no release)
#   - Push to main (build + test; no release)
#   - Version tag v* (build + test + package + GitHub Release)
#   - Manual workflow_dispatch (build + test; optional release via input)
#
# The workflow does NOT silently ignore failed restore/build/test/publish
# steps. Each stage runs without `continue-on-error` so a failure fails the
# job. The only optional/best-effort steps are SumatraPDF download and
# MSI/bundle signing (which depend on external availability + secrets).
#
# Concurrency: one build per branch/tag at a time; in-progress runs are
# cancelled when a new commit arrives. Tag builds are NOT cancelled (each
# tag deserves a complete release).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Tag to publish as a GitHub Release (e.g. v0.6.0). Leave empty to skip release.'
        required: false
        default: ''
      build-msi:
        description: 'Also build the MSI installer on this run (artifact ONLY — never publishes a release)'
        required: false
        default: false
        type: boolean

# Least-privilege permissions at workflow level (read-only). The release
# job below declares `contents: write` explicitly.
permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  # Tag pushes are not cancelled — every tag deserves a complete release.
  # Branch/PR pushes cancel in-progress runs on the same ref.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  # Hoisted to job level so step `if:` conditions can read secrets
  # (the `secrets` context is not available inside step `if:`).
  PFX_B64: ${{ secrets.PRINTSHOP_CODE_SIGN_PFX }}
  PFX_PWD: ${{ secrets.PRINTSHOP_CODE_SIGN_PWD }}
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OUTPUT: 'off'

jobs:
  build:
    name: Build, test, package PrintEXE (win-x64)
    runs-on: windows-latest
    # Phase 7.1 review fix M3: without a job-level timeout a hung step can
    # burn GitHub's default 360-minute budget; the observed healthy runtime
    # is ~6 minutes, so 45 is a generous ceiling.
    timeout-minutes: 45
    # The build job stays least-privilege (read-only). Releases are created
    # by a separate job that depends on this one passing, so a failed
    # build never produces a release.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for version detection + tag lookup

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set BUILD_VERSION from git tag
        shell: pwsh
        run: |
          # Resolve the version string from the git ref.
          # - Tag push (refs/tags/v0.5.5) -> "0.5.5"
          # - workflow_dispatch with release-tag -> that tag
          # - Otherwise (branch push / PR) -> "0.0.<run_number>"
          #
          # Directory.Build.props reads $(BUILD_VERSION) and writes it into
          # <AssemblyVersion>/<FileVersion>, so a v0.5.5 release ships with
          # assembly version 0.5.5.0 and the GitHubUpdateService.IsNewer()
          # check returns false after the update completes.
          #
          # .NET <Version> MUST be a valid System.Version string
          # (major.minor[.build[.revision]]) — no SemVer pre-release suffixes.
          $tag = "${{ github.event.inputs.release-tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $ver = $tag -replace '^v',''
          # Phase 5 fix: a SemVer pre-release tag (v0.6.1-rc.1) must map to a
          # VALID System.Version for <AssemblyVersion> — strip everything after
          # the numeric core. The original tag is preserved for the GitHub
          # release (the release job uses github.ref_name, not BUILD_VERSION).
          if ($ver -match '^(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
          } else {
            $ver = "0.0.${{ github.run_number }}"
          }
          Write-Host "Resolved BUILD_VERSION = $ver"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VERSION=$ver" -Encoding utf8NoBOM

      - name: Restore NuGet dependencies
        shell: pwsh
        run: dotnet restore PrintShopCompanion.sln

      - name: Build solution (Release)
        id: build
        shell: pwsh
        run: |
          # Stage 5: the native build log ships as an artifact (cmd /c keeps
          # exit codes intact regardless of $ErrorActionPreference).
          $logDir = "$env:GITHUB_WORKSPACE\artifacts\logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          cmd /c "dotnet build PrintShopCompanion.sln -c Release --no-restore > `"$logDir\build.log`" 2>&1"
          $rc = $LASTEXITCODE
          Get-Content "$logDir\build.log" -Tail 15
          if ($rc -ne 0) { Write-Error "Build failed (rc=$rc) — full log in the build-logs artifact"; exit $rc }

      - name: Run tests
        id: test
        shell: pwsh
        run: |
          # No continue-on-error: a failed test MUST fail the build so a
          # broken release is never published. Test results are uploaded
          # as an artifact for inspection.
          # NOTE: the TRX logger uses LogFilePrefix (Phase 7.1 review fix H1):
          # a fixed LogFileName would make the net10.0-windows run OVERWRITE
          # the net10.0 leg's results file per project, silently discarding
          # half the test evidence. LogFilePrefix yields
          # tests_<tfm>_<timestamp>.trx — unique per TFM and per run.
          # The --collector:"XPlat Code Coverage" flag breaks PowerShell arg
          # parsing (the space in "XPlat Code Coverage" splits into two
          # MSBuild switches and MSBuild rejects it with MSB1001).
          # Stage 4: dotnet test on the SOLUTION runs EVERY test project in
          # BOTH target frameworks (net10.0 AND net10.0-windows) on the
          # Windows runner — the full battery, not just the neutral leg.
          $logDir = "$env:GITHUB_WORKSPACE\artifacts\logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          cmd /c "dotnet test PrintShopCompanion.sln -c Release --no-build --logger \`"trx;LogFilePrefix=tests\`" > `"$logDir\test.log`" 2>&1"
          $rc = $LASTEXITCODE
          Get-Content "$logDir\test.log" -Tail 20
          if ($rc -ne 0) { Write-Error "Tests failed (rc=$rc) — full log in the build-logs artifact"; exit $rc }

      - name: Publish app (folder distribution, self-contained, win-x64)
        id: publish
        shell: pwsh
        run: |
          # Folder distribution (NOT single-file) — preserves SQLCipher +
          # SQLite native DLLs alongside the EXE so they load reliably.
          # The App csproj sets SelfContained=false; we override to true
          # so the published ZIP includes the .NET runtime and runs on
          # machines without .NET 10 installed.
          dotnet publish src/PrintShopCompanion.App/PrintShopCompanion.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o ./artifacts/app

      - name: Validate published output
        id: validate
        shell: pwsh
        run: |
          # Verify the publish directory has the EXE + the native
          # dependencies that MUST travel with it. A missing native
          # DLL would crash the app on first SQLCipher call.
          $pub = "$env:GITHUB_WORKSPACE\artifacts\app"
          if (-not (Test-Path $pub)) {
            Write-Error "Publish directory not found: $pub"
            exit 1
          }
          $exe = Join-Path $pub "PrintShopCompanion.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "PrintShopCompanion.exe not found in publish output"
            exit 1
          }
          Write-Host "✓ PrintShopCompanion.exe present"

          # Required native + managed DLLs. SQLCipher and SQLite native
          # libraries come from SQLitePCLRaw.bundle_e_sqlcipher.
          $requiredDlls = @(
            "PrintShopCompanion.dll",
            "PrintShopCompanion.Infrastructure.dll",
            "PrintShopCompanion.Core.dll",
            "Microsoft.Data.Sqlite.dll",
            "SQLitePCLRaw.batteries_v2.dll"
          )
          foreach ($dll in $requiredDlls) {
            if (-not (Test-Path (Join-Path $pub $dll))) {
              Write-Error "Missing required DLL: $dll"
              exit 1
            }
            Write-Host "✓ $dll present"
          }

          # Native SQLCipher lib — MUST be e_sqlcipher.dll by exact name. The
          # previous glob (e_sql*.dll) would happily accept e_sqlite3.dll
          # alone, which is precisely the failure mode v0.7.2 fixes (plain
          # SQLite shipped, SQLCipher missing → encrypted queue refused to
          # open on user machines).
          $sqlcipher = Get-ChildItem -Path $pub -Filter "e_sqlcipher.dll" -ErrorAction SilentlyContinue
          if (-not $sqlcipher) {
            Write-Error "e_sqlcipher.dll MISSING from publish output — the encrypted queue would fail on every user machine"
            exit 1
          }
          Write-Host "✓ e_sqlcipher.dll present ($($sqlcipher.FullName))"
          foreach ($n in (Get-ChildItem -Path $pub -Filter "e_sql*.dll" -ErrorAction SilentlyContinue)) {
            Write-Host "✓ Native: $($n.Name)"
          }

          # appsettings.json must travel with the EXE (runtime config).
          if (-not (Test-Path (Join-Path $pub "appsettings.json"))) {
            Write-Error "Missing appsettings.json in publish output"
            exit 1
          }
          Write-Host "✓ appsettings.json present"

          # Sanity: no .env, no local DBs, no source files in the publish dir.
          $forbidden = @(
            "*.env", ".env", ".env.*",
            "*.db", "*.db-shm", "*.db-wal", "*.sqlite", "*.sqlite-shm", "*.sqlite-wal",
            "*.pfx", "*.p12", "*.key"
          )
          foreach ($pat in $forbidden) {
            $hits = Get-ChildItem -Path $pub -Filter $pat -ErrorAction SilentlyContinue
            if ($hits) {
              Write-Error "Forbidden file in publish output: $($hits.Name -join ', ')"
              exit 1
            }
          }
          Write-Host "✓ No secrets/databases in publish output"

          # List the publish dir size for the log.
          $size = (Get-ChildItem -Path $pub -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Publish directory size: $([math]::Round($size / 1MB, 2)) MB"

      - name: Bundle SumatraPDF into the ZIP distribution
        shell: pwsh
        run: |
          # v0.7.4 fix: the v0.7.3 ZIP shipped WITHOUT SumatraPDF.exe, so on a
          # real machine every print fell through to the GDI fallback
          # (log: "SumatraPDF.exe not found ... trying next" / "physical
          # outcome cannot be confirmed"). SumatraPdfPrinter.ResolveExePath()
          # looks for SumatraPDF.exe next to the app EXE (after
          # runtimes/win-x64/native and the configured path) — placing it in
          # the publish root makes the ZIP self-contained. The MSI job does
          # the same for the installer layout (installer/redist).
          $candidates = @(
            'https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip',
            'https://files.sumatrapdfreader.org/software/sumatrapdf/rel/3.6.1/SumatraPDF-3.6.1-64.zip',
            'https://www.sumatrapdfreader.org/dl/Rel/3.5.1/SumatraPDF-3.5.1-64.zip'
          )
          $ok = $false
          foreach ($url in $candidates) {
            try {
              Write-Host "Trying $url"
              Invoke-WebRequest -Uri $url -OutFile sumatra.zip `
                -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -TimeoutSec 120
              if ((Get-Item sumatra.zip).Length -gt 1MB) { $ok = $true; Write-Host "Downloaded $url"; break }
              Write-Host "Suspiciously small download from $url — trying next"
            } catch { Write-Host "FAILED ${url}: $($_.Exception.Message)" }
          }
          if (-not $ok) { Write-Error 'All SumatraPDF download URLs failed'; exit 1 }
          Expand-Archive sumatra.zip -DestinationPath sumatra -Force
          $exe = Get-ChildItem -Path sumatra -Filter 'SumatraPDF*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'SumatraPDF exe not found inside the downloaded zip'; exit 1 }
          $dst = "$env:GITHUB_WORKSPACE\artifacts\app\SumatraPDF.exe"
          Copy-Item $exe.FullName $dst -Force
          if (-not (Test-Path $dst)) { Write-Error "Copy to $dst failed"; exit 1 }
          Write-Host "✓ Bundled SumatraPDF into the ZIP distribution: $dst ($([math]::Round((Get-Item $dst).Length / 1MB, 2)) MB)"

      - name: Startup verification (real WPF launch, --ci-smoke)
        id: smoke
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Phase 7: replaces the v0.7.4 liveness-only smoke test, which read
          # "process alive after 20s" as success — and PASSED for v0.7.15,
          # v0.7.16 and v0.7.17, three releases that died at startup on user
          # machines behind a modal error MessageBox (a blocked process is
          # "alive"). The new gate launches the REAL published EXE with
          # --ci-smoke and requires ALL of:
          #   1. exit code 0 within a strict 90s timeout (the app shuts itself
          #      down after MainWindow Loaded; it never opens a modal dialog
          #      in this mode, so a broken startup EXITS instead of blocking)
          #   2. log marker '=== CI-SMOKE: DI HOST BUILT ==='  (DI graph
          #      constructed AND started)
          #   3. log marker '=== Startup complete ==='
          #   4. zero [FTL] lines / no 'Startup failed' since launch
          #   5. ci-smoke-result.txt says status=PASS or status=RENDER-
          #      UNVERIFIED. Run 46117422005 evidence: the hosted runner's
          #      session does not always complete a WPF render pass, so the
          #      Loaded event may never fire there — the app then reports
          #      RENDER-UNVERIFIED honestly. Liveness alone can NEVER pass:
          #      the REQUIRED UIA probe step that follows proves real UI
          #      interaction on the real window, or the job fails.
          $exe = "$env:GITHUB_WORKSPACE\artifacts\app\PrintShopCompanion.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE missing for smoke test"; exit 1 }
          # Kill any lingering instance from an earlier retry — a forwarded
          # mutex handoff would exit 0 WITHOUT running the real startup path.
          Get-Process -Name PrintShopCompanion -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $logDir = Join-Path $env:APPDATA "PrintShop\Companion\logs"
          if (Test-Path $logDir) {
            Remove-Item "$logDir\companion-*.log" -Force -ErrorAction SilentlyContinue
            Remove-Item "$logDir\ci-smoke-result.txt" -Force -ErrorAction SilentlyContinue
          }
          # Phase 7.1 review fix M2: -NoNewWindow forces UseShellExecute=false
          # so $p.ExitCode is deterministic (ShellExecute-launched processes
          # can return null ExitCode on some PowerShell builds, which would
          # FALSE-FAIL a healthy startup).
          $p = Start-Process -FilePath $exe -ArgumentList "--ci-smoke" -PassThru -NoNewWindow
          $timedOut = -not $p.WaitForExit(90000)
          if ($timedOut) {
            Write-Host "!! Startup verification TIMEOUT after 90s — killing (a healthy --ci-smoke run exits on its own)"
            # Phase 7.1 review fix M1: kill the whole PROCESS TREE — children
            # (SumatraPDF renderer, helpers) survive a bare Stop-Process and
            # would hold file locks on the artifact directories.
            try { taskkill /PID $p.Id /T /F 2>$null | Out-Null } catch { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {} }
          }
          $exitCode = $null
          if ($p.HasExited) { try { $exitCode = $p.ExitCode } catch {} }
          # ── Collect diagnostics (ALWAYS — pass or fail they ship as artifacts) ──
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts\startup-logs" | Out-Null
          if (Test-Path $logDir) {
            Copy-Item "$logDir\*" "$env:GITHUB_WORKSPACE\artifacts\startup-logs\" -Force -ErrorAction SilentlyContinue
          }
          $logText = ""
          $newestLog = Get-ChildItem -Path $logDir -Filter "companion-*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if ($newestLog) { $logText = Get-Content $newestLog.FullName -Raw -ErrorAction SilentlyContinue }
          $resultText = ""
          if (Test-Path "$logDir\ci-smoke-result.txt") { $resultText = Get-Content "$logDir\ci-smoke-result.txt" -Raw }
          # ── Gate evaluation (fail-closed: any missing signal = failure) ──
          $fail = @()
          if ($timedOut) { $fail += "process did not exit within 90s (modal dialog or hang)" }
          elseif ($exitCode -ne 0) { $fail += "exit code $exitCode (nonzero = fatal startup path)" }
          if ($logText -notmatch '=== CI-SMOKE: DI HOST BUILT ===') { $fail += "marker missing: DI HOST BUILT (dependency injection initialization)" }
          # Loaded is the UI-render SIGNAL, not a hard gate: run 46117422005
          # proved the hosted-runner session may never complete a WPF render
          # pass. The REQUIRED UIA probe step verifies real UI interaction —
          # so a liveness-only pass is impossible.
          if ($logText -match 'CI-SMOKE: MAINWINDOW LOADED') {
            Write-Host "✓ UI render CONFIRMED: MainWindow Loaded lifecycle completed"
          } else {
            Write-Host "!! UI render NOT confirmed via Loaded (non-interactive session suspected) — the UIA probe step is the UI-verifying gate"
          }
          if ($logText -notmatch '=== Startup complete ===') { $fail += "marker missing: '=== Startup complete ==='" }
          if ($logText -match '\[FTL\]' -or $logText -match 'Startup failed') { $fail += "fatal log entries ([FTL] / 'Startup failed') present since launch" }
          if ($resultText -notmatch 'status=PASS' -and $resultText -notmatch 'status=RENDER-UNVERIFIED') { $fail += "ci-smoke-result.txt says neither PASS nor RENDER-UNVERIFIED" }
          Write-Host "── startup verification diagnostics ──"
          Write-Host "exit code: $(if ($timedOut) { 'TIMEOUT (tree-killed after 90s; taskkill reports its own code)' } elseif ($p.HasExited) { $exitCode } else { 'UNKNOWN' })"
          Write-Host "markers: DI=$(($logText -match 'CI-SMOKE: DI HOST BUILT')) LOADED=$(($logText -match 'CI-SMOKE: MAINWINDOW LOADED')) COMPLETE=$(($logText -match '=== Startup complete ==='))"
          if ($resultText) { Write-Host "result file: $($resultText.Trim())" }
          if ($fail.Count -gt 0) {
            Write-Host "── log tail (last 40 lines) ──"
            if ($logText) { $logText -split "`n" | Select-Object -Last 40 | Write-Host }
            Write-Error ("Startup verification FAILED: " + ($fail -join '; '))
            exit 1
          }
          Write-Host "✓ Startup verification PASSED: exit 0, DI host built and started, startup-complete marker present, zero fatal log entries; UI confirmation = PASS (Loaded fired) or RENDER-UNVERIFIED (UIA probe decides)"
          # v0.7.4: also kill any SumatraPDF.exe the run may have spawned — a
          # lingering renderer process would block the upload step's file
          # handles on the publish directory.
          try { Get-Process -Name SumatraPDF -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}

      - name: UI automation probe (real login-window interaction)
        id: uia
        shell: powershell
        timeout-minutes: 4
        run: tools/uia_probe.ps1 -ExePath "$env:GITHUB_WORKSPACE\artifacts\app\PrintShopCompanion.exe"

      - name: Fatal-path verification (malformed config must fail closed)
        id: fatal
        shell: pwsh
        timeout-minutes: 3
        run: |
          # Phase 8 Stage 3: deliberately corrupt appsettings.json and verify
          # the app FAILS CLOSED: nonzero exit, fatal diagnostics, no dialog,
          # ci-smoke-result status != PASS.
          #
          # WHY NOT the corrupt-queue.db scenario (runs 4-5 evidence): the
          # queue DB is opened LAZILY at first queue use, and the documented
          # design is degrade-and-heal (LocalSettingsStore.cs:73 keeps a
          # .corrupt backup and starts fresh rather than crashing startup) -
          # a corrupt DB is survivable BY DESIGN, and an unpaired CI run
          # never touches the queue. Configuration loading IS a real eager
          # startup path: appsettings.json is parsed when the host builds,
          # so a malformed file must throw, land in the startup catch, and
          # exit 1 with fatal diagnostics.
          $exe = "$env:GITHUB_WORKSPACE\artifacts\app\PrintShopCompanion.exe"
          $exeDir = Split-Path $exe
          if (-not (Test-Path $exe)) { Write-Error "EXE missing for fatal-path test"; exit 1 }
          Get-Process -Name PrintShopCompanion -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $logDir = Join-Path $env:APPDATA "PrintShop\Companion\logs"
          Remove-Item "$logDir\companion-*.log" -Force -ErrorAction SilentlyContinue
          Remove-Item "$logDir\ci-smoke-result.txt" -Force -ErrorAction SilentlyContinue
          # corrupt the config (backup first - the packaging steps after this
          # step need the REAL file)
          $cfg = Join-Path $exeDir "appsettings.json"
          $bak = "$cfg.fatalpath-bak"
          Copy-Item $cfg $bak -Force
          Set-Content -Path $cfg -Value '{ "NOT": "VALID JSON-------' -NoNewline
          try {
            $p = Start-Process -FilePath $exe -ArgumentList "--ci-smoke" -PassThru -NoNewWindow
            $timedOut = -not $p.WaitForExit(90000)
            if ($timedOut) { try { taskkill /PID $p.Id /T /F 2>$null | Out-Null } catch { } }
            $exitCode = $null
            if ($p.HasExited) { try { $exitCode = $p.ExitCode } catch { } }
          } finally {
            # restore the REAL config no matter what - the packaging steps
            # after this step need it intact
            Move-Item $bak $cfg -Force
          }
          $newestLog = Get-ChildItem -Path $logDir -Filter "companion-*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          $logText = ""
          if ($newestLog) { $logText = Get-Content $newestLog.FullName -Raw -ErrorAction SilentlyContinue }
          $resultText = ""
          if (Test-Path "$logDir\ci-smoke-result.txt") { $resultText = Get-Content "$logDir\ci-smoke-result.txt" -Raw }
          # ship the evidence even on failure
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts\startup-logs\fatal-path" | Out-Null
          if ($newestLog) { Copy-Item $newestLog.FullName "$env:GITHUB_WORKSPACE\artifacts\startup-logs\fatal-path\" -Force -ErrorAction SilentlyContinue }
          if ($resultText) { Set-Content "$env:GITHUB_WORKSPACE\artifacts\startup-logs\fatal-path\ci-smoke-result.txt" -Value $resultText }
          $bad = @()
          if ($timedOut) { $bad += "process hung on malformed config (no fail-closed exit within 90s)" }
          elseif ($exitCode -eq 0) { $bad += "exit code 0 - malformed appsettings.json did NOT fail closed" }
          if ($logText -notmatch '\[FTL\]' -and $logText -notmatch 'Startup failed') { $bad += "no fatal diagnostics logged ([FTL]/Startup failed missing)" }
          if ($resultText -match 'status=PASS') { $bad += "result file says PASS - malformed config reported as a healthy startup" }
          Write-Host "exit code: $(if ($timedOut) { 'TIMEOUT' } else { $exitCode })"
          if ($resultText) { Write-Host "result: $($resultText.Trim())" }
          if ($bad.Count -gt 0) {
            Write-Host "── log tail ──"
            if ($logText) { $logText -split "`n" | Select-Object -Last 40 | Write-Host }
            Write-Error ("FATAL-PATH VERIFICATION FAILED: " + ($bad -join '; '))
            exit 1
          }
          Write-Host "✓ Fatal-path verification PASSED: malformed config → exit $exitCode, fatal diagnostics logged, no PASS (fail-closed)"

      - name: Verification gate summary
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UIA_OUTCOME: ${{ steps.uia.outcome }}
          FATAL_OUTCOME: ${{ steps.fatal.outcome }}
        run: |
          # Stage 5: native build, tests, publish, output validation, startup
          # verification and packaging are reported SEPARATELY on the run
          # summary page — "green build" can never again be read as "working
          # app" without the startup row being green too.
          $gates = [ordered]@{
            "native Windows build (net10.0 + net10.0-windows)" = $env:BUILD_OUTCOME
            "tests (both target frameworks)"                   = $env:TEST_OUTCOME
            "self-contained win-x64 publish"                   = $env:PUBLISH_OUTCOME
            "publish output validation (native DLLs)"          = $env:VALIDATE_OUTCOME
            "startup verification (real WPF launch)"           = $env:SMOKE_OUTCOME
            "packaging (ZIP + SHA-256)"                        = $env:PACKAGE_OUTCOME
            "UI automation (real login interaction)"           = $env:UIA_OUTCOME
            "fatal-path fail-closed (corrupt DB)"              = $env:FATAL_OUTCOME
          }
          $lines = @("| Gate | Result |", "|---|---|")
          foreach ($k in $gates.Keys) { $lines += ("| {0} | {1} |" -f $k, $gates[$k]) }
          ($lines -join "`n") | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Host ($lines -join "`n")

      - name: Write version metadata (BUILD-INFO.txt)
        shell: pwsh
        run: |
          $ver = $env:BUILD_VERSION
          $build = "${{ github.run_number }}"
          $commit = "${{ github.sha }}"
          $branch = "${{ github.ref_name }}"
          $built = (Get-Date -Format 'o')
          @"
          PrintEXE build metadata
          =======================
          Version:      $ver
          Build:        $build (GitHub Actions run #${{ github.run_number }})
          Commit:       $commit
          Branch/Tag:   $branch
          Built:        $built
          Architecture: win-x64
          Configuration: Release (self-contained, folder distribution)
          Source:       https://github.com/Arjunyadavsoma/PrintEXE
          "@ | Out-File -Encoding utf8 artifacts/BUILD-INFO.txt
          # Phase 5: the distribution ZIP must CONTAIN build metadata — copy
          # into the publish directory before packaging (a loose asset copy
          # also stays next to the ZIP for direct download).
          Copy-Item artifacts/BUILD-INFO.txt "$env:GITHUB_WORKSPACE\artifacts\app\BUILD-INFO.txt"
          Get-Content artifacts/BUILD-INFO.txt

      - name: Write README into artifact (installation instructions)
        shell: pwsh
        run: |
          @"
          # PrintEXE v$($env:BUILD_VERSION) - Windows x64 (portable)

          ## Installation
          1. Unzip this archive to a folder, e.g. ``C:\PrintEXE\``.
          2. Run ``PrintShopCompanion.exe`` from inside that folder.
          3. On first launch, sign in to your shop at
             https://printelyx.cc.cd/shop/login, go to
             Printer Setup -> Register new agent, copy the device token,
             and paste it into PrintEXE's pairing form.
          4. Go to the Printers tab and select your printer.

          ## Requirements
          - Windows 10/11 (x64). No .NET install required (self-contained).
          - A printer installed in Windows.

          ## Auto-update
          PrintEXE checks GitHub Releases on startup. When a new version is
          available, a banner appears; click "Update Now" to download,
          verify SHA-256, and swap the install folder.

          Built from commit ${{ github.sha }}.
          "@ | Out-File -Encoding utf8 artifacts/README.txt
          Copy-Item artifacts/README.txt "$env:GITHUB_WORKSPACE\artifacts\app\README.txt"
          Get-Content artifacts/README.txt

      - name: Package publish directory into PrintEXE-vX.Y.Z-win-x64.zip
        id: package
        shell: pwsh
        run: |
          $ver = $env:BUILD_VERSION
          # Phase 5: on a tag build, name the ZIP after the FULL tag (e.g.
          # PrintEXE-v0.6.1-rc.2-win-x64.zip) so the asset name matches the
          # release page instructions exactly; branch/dispatch builds keep
          # the stripped BUILD_VERSION name.
          $refTag = "${{ github.ref_name }}"
          if ($refTag -match '^v\d+\.\d+\.\d+') { $zipName = "PrintEXE-$refTag-win-x64.zip" } else { $zipName = "PrintEXE-v$ver-win-x64.zip" }
          $src = "$env:GITHUB_WORKSPACE\artifacts\app"
          $dst = "$env:GITHUB_WORKSPACE\artifacts\$zipName"
          # Use 7-Zip (pre-installed on windows-latest runners) — preserves
          # file permissions and is faster than Compress-Archive.
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $7z) {
            & $7z a -tzip $dst "$src\*"
          } else {
            Compress-Archive -Path "$src\*" -DestinationPath $dst -Force
          }
          if (-not (Test-Path $dst)) {
            Write-Error "ZIP was not created: $dst"
            exit 1
          }
          $zip = Get-Item $dst
          Write-Host "✓ Created $zipName ($([math]::Round($zip.Length / 1MB, 2)) MB)"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_PATH=$dst" -Encoding utf8NoBOM
          # Phase 6 (review finding): the shipped auto-updater selects assets by
          # the literal name "PrintShopCompanion-portable.zip"
          # (GitHubUpdateService.PortableZipName). Without an asset under that
          # exact name, DownloadUrl resolves to null on EVERY release and no
          # installed version can ever self-update. Publish the SAME bytes
          # under the updater's name; the tag-matched ZIP stays the canonical
          # human download.
          $portable = "$env:GITHUB_WORKSPACE\artifacts\PrintShopCompanion-portable.zip"
          Copy-Item $dst $portable -Force
          if (-not (Test-Path $portable)) { Write-Error "Portable updater ZIP copy failed"; exit 1 }
          $pzip = Get-Item $portable
          Write-Host "✓ Created PrintShopCompanion-portable.zip ($([math]::Round($pzip.Length / 1MB, 2)) MB) — byte-identical updater asset"
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_NAME=PrintShopCompanion-portable.zip" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_PATH=$portable" -Encoding utf8NoBOM

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          # Checksum the ZIP (primary artifact) + the portable updater asset
          # (byte-identical copy under the updater's asset name) + BUILD-INFO.txt.
          # Format matches the standard ``sha256sum`` output so users can
          # verify with ``sha256sum -c SHA256SUMS.txt`` on any platform.
          $hashes = @()
          $zip = Get-Item $env:ZIP_PATH
          $sha = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          $hashes += "$sha  $($zip.Name)"
          Write-Host "$sha  $($zip.Name)"
          $portableItem = Get-Item $env:PORTABLE_PATH
          $sha3 = (Get-FileHash -Algorithm SHA256 $portableItem.FullName).Hash.ToLower()
          $hashes += "$sha3  $($portableItem.Name)"
          Write-Host "$sha3  $($portableItem.Name)"
          $info = Get-Item artifacts/BUILD-INFO.txt
          $sha2 = (Get-FileHash -Algorithm SHA256 $info.FullName).Hash.ToLower()
          $hashes += "$sha2  $($info.Name)"
          Write-Host "$sha2  $($info.Name)"
          $hashes | Out-File -Encoding ascii artifacts/SHA256SUMS.txt
          Write-Host "SHA256SUMS.txt contents:"
          Get-Content artifacts/SHA256SUMS.txt

      - name: Verify ZIP checksum round-trip
        shell: pwsh
        run: |
          # Re-read the checksum from SHA256SUMS.txt and verify it matches
          # the actual ZIP file. This catches a corrupt ZIP or a typo in
          # the checksum file.
          #
          # The ZIP is always written as the FIRST line of SHA256SUMS.txt
          # (see the Generate step). Take that line and extract the 64-char
          # hex hash before the first space. Avoid regex on the filename
          # (the `.` in PrintEXE-vX.Y.Z-win-x64.zip is a regex meta-char and
          # caused a mismatch in an earlier version).
          $lines = Get-Content artifacts/SHA256SUMS.txt
          $zipLine = $lines | Where-Object { $_ -like "*$env:ZIP_NAME*" } | Select-Object -First 1
          if (-not $zipLine) {
            Write-Error "Could not find $env:ZIP_NAME in SHA256SUMS.txt"
            exit 1
          }
          # The hash is the first 64 chars (SHA-256 hex). Use a literal
          # substring split on the first space, not a regex split.
          $idx = $zipLine.IndexOf(' ')
          if ($idx -lt 64) {
            Write-Error "Malformed checksum line: $zipLine"
            exit 1
          }
          $expected = $zipLine.Substring(0, 64).ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $env:ZIP_PATH).Hash.ToLower()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($expected -ne $actual) {
            Write-Error "Checksum mismatch! Expected: $expected  Actual: $actual"
            exit 1
          }
          # Phase 6: the portable updater asset must be BYTE-IDENTICAL to the
          # versioned ZIP — it is the same file under the updater's asset name.
          $portableHash = (Get-FileHash -Algorithm SHA256 $env:PORTABLE_PATH).Hash.ToLower()
          if ($portableHash -ne $actual) {
            Write-Error "PrintShopCompanion-portable.zip is not byte-identical to $env:ZIP_NAME"
            exit 1
          }
          Write-Host "✓ Checksum verified: $actual (portable updater asset byte-identical)"

      - name: Upload PrintEXE ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintEXE-win-x64
          path: |
            artifacts/${{ env.ZIP_NAME }}
            artifacts/PrintShopCompanion-portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            artifacts/README.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 30

      - name: Upload startup logs + smoke diagnostics
        # Stage 5: the startup verification's own evidence — Serilog log of
        # the real launch, ci-smoke-result.txt — ships on EVERY run, pass or
        # fail, so a failed startup is diagnosable without re-running.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logs
          path: 'artifacts/startup-logs/**'
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build + test console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: 'artifacts/logs/**'
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # Release job — runs ONLY on tag pushes (or manual dispatch with a tag).
  # Depends on the build job passing, so a failed build never produces a
  # release. This job has `contents: write` to create the release; the
  # build job is read-only.
  # ──────────────────────────────────────────────────────────────────────

  # Optional MSI build (WiX v5). The research phase (PRINTEXE_ENGINEERING_DECISIONS
  # D-13) found the WiX sources were never built by CI and shipped with missing
  # assets; this job exercises them on tags. SumatraPDF.exe is downloaded from the
  # official release (GPL-3.0, invoked as a separate process only — see
  # docs/THIRD_PARTY_NOTICES.md).
  # ──────────────────────────────────────────────────────────────────────
  # XAML static audit (Phase 7 / Stage 3) — runs in seconds on ubuntu and
  # catches the defect classes that shipped broken releases: missing
  # StaticResource keys (v0.7.15 NavItem), Style TargetType vs element
  # mismatches (v0.7.19 InputField/PasswordBox), broken BasedOn chains,
  # duplicate resource keys, missing converter classes, malformed merged
  # dictionaries. It is a REQUIRED gate for the msi + release jobs below.
  # ──────────────────────────────────────────────────────────────────────
  xaml-audit:
    name: XAML static audit (resource graph)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run XAML resource audit
        run: |
          mkdir -p artifacts
          python3 tools/xaml_audit.py src/PrintShopCompanion.App --report artifacts/xaml-audit-report.txt
          cat artifacts/xaml-audit-report.txt

      - name: Run XAML audit regression tests (v0.7.18 / v0.7.19 defect fixtures)
        # The detector itself is tested: fixtures reproducing both field
        # crashes MUST be flagged, a clean fixture MUST pass.
        run: python3 -m unittest discover -s tools -p "test_xaml_audit*.py" -v

      - name: Upload XAML audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaml-audit-report
          path: artifacts/xaml-audit-report.txt
          if-no-files-found: ignore
          retention-days: 30

  msi:
    name: Build MSI + install smoke (artifact only)
    needs: [build, xaml-audit]
    timeout-minutes: 25
    # Phase 9 Stage 7: the MSI is built and INSTALL-TESTED on EVERY push to
    # main as an uploaded ARTIFACT - installer validation no longer requires a
    # tag or dispatch permission. Nothing here ever publishes a release (the
    # release job below still requires an explicitly pushed tag).
    if: ${{ github.event_name == 'push' || github.event.inputs.release-tag != '' || github.event.inputs.build-msi == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WiX v5 tooling
        # v0.7.10 fix: the unpinned `dotnet tool install --global wix` pulled
        # WiX 7.0.1, which refuses to run in CI until you accept its Open
        # Source Maintenance Fee EULA (error WIX7015). Everything in this
        # repo targets WiX v5 (installer/README.md, BuildInstaller.bat, the
        # .wxs sources) — pin the tool to the latest v5.
        run: dotnet tool install --global wix --version 5.*

      - name: Download SumatraPDF (bundled renderer)
        shell: pwsh
        run: |
          # v0.7.4 fix: the pinned 3.5.1 URL (uppercase /dl/Rel/) was removed
          # from the SumatraPDF CDN (307 -> 404) and broke the v0.7.3 MSI job.
          # Current source of truth: https://www.sumatrapdfreader.org/download-free-pdf-viewer
          # which serves /dl/rel/3.6.1/... (lowercase). Try the current version
          # first, then pinned fallbacks (direct files CDN + the legacy 3.5.1
          # path), so one CDN reshuffle cannot kill the release again.
          # NOTE: the zips contain SumatraPDF-<version>-64.exe (not SumatraPDF.exe).
          $candidates = @(
            'https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip',
            'https://files.sumatrapdfreader.org/software/sumatrapdf/rel/3.6.1/SumatraPDF-3.6.1-64.zip',
            'https://www.sumatrapdfreader.org/dl/Rel/3.5.1/SumatraPDF-3.5.1-64.zip'
          )
          $ok = $false
          foreach ($url in $candidates) {
            try {
              Write-Host "Trying $url"
              # Use a browser UA: the CDN 403s python-urllib/curl-default agents.
              Invoke-WebRequest -Uri $url -OutFile sumatra.zip `
                -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -TimeoutSec 120
              if ((Get-Item sumatra.zip).Length -gt 1MB) { $ok = $true; Write-Host "Downloaded $url"; break }
              Write-Host "Suspiciously small download from $url — trying next"
            } catch { Write-Host "FAILED ${url}: $($_.Exception.Message)" }
          }
          if (-not $ok) { Write-Error 'All SumatraPDF download URLs failed'; exit 1 }
          Expand-Archive sumatra.zip -DestinationPath sumatra -Force
          $exe = Get-ChildItem -Path sumatra -Filter 'SumatraPDF*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'SumatraPDF exe not found inside the downloaded zip'; exit 1 }
          New-Item -ItemType Directory -Force -Path installer/redist | Out-Null
          Copy-Item $exe.FullName installer/redist/SumatraPDF.exe -Force
          Write-Host "Bundled $($exe.Name) as installer/redist/SumatraPDF.exe"

      - name: Publish app (win-x64)
        shell: pwsh
        run: |
          # v0.7.9 fix: normalize the tag into a valid System.Version before
          # handing it to BUILD_VERSION. The raw ref name ("v0.7.8") made
          # <AssemblyVersion>v0.7.8.0</AssemblyVersion> fail CS7034 — the
          # build job strips the 'v' and any pre-release suffix in its
          # "Set BUILD_VERSION from git tag" step; the MSI job never did
          # (it never got this far: v0.7.3 died downloading SumatraPDF,
          # v0.7.7 at restore). Same normalization, same rules.
          $tag = '${{ github.event.inputs.release-tag || github.ref_name }}'
          $ver = $tag -replace '^v',''
          if ($ver -match '^(\d+\.\d+\.\d+)') { $ver = $Matches[1] }
          # Phase 9: MSI builds on every main push - 'main' is not a valid
          # WiX ProductVersion, so fall back to a numeric per-run version.
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "0.9.$env:GITHUB_RUN_NUMBER" }
          Write-Host "BUILD_VERSION = $ver (from '$tag')"
          # v0.7.8 fix: restore explicitly FIRST so a restore problem
          # surfaces with real diagnostics instead of MSB4181, then publish
          # --no-restore (implicit restore ran under the runner's default
          # SDK 11 in v0.7.7).
          dotnet restore src/PrintShopCompanion.App/PrintShopCompanion.App.csproj -r win-x64
          dotnet publish src/PrintShopCompanion.App/PrintShopCompanion.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:BUILD_VERSION=$ver `
            --no-restore `
            -o publish
          # v0.7.12 fix: the WiX source installs PrintShopCompanion.Worker.exe
          # (WorkerFeature) from the same publish dir — the MSI job never
          # published it (WIX0103: cannot find the File). Framework-dependent
          # is enough for the worker; it travels with the app's runtime files.
          # v0.7.13: -f net10.0-windows — the Worker multi-targets, and
          # 'Publish' on a multi-targeted project without -f fails NETSDK1129.
          # v0.7.14: no -f on the RESTORE — 'dotnet restore' has no
          # --framework option (-f means --force there), so 'net10.0-windows'
          # became a second positional project (MSB1008). Restore covers all
          # TFMs; the publish keeps -f net10.0-windows, which IS valid there.
          dotnet restore src/PrintShopCompanion.Worker/PrintShopCompanion.Worker.csproj -r win-x64
          dotnet publish src/PrintShopCompanion.Worker/PrintShopCompanion.Worker.csproj `
            -c Release -r win-x64 --self-contained false `
            -f net10.0-windows `
            -p:BUILD_VERSION=$ver `
            --no-restore `
            -o publish

      - name: Build MSI
        shell: pwsh
        run: |
          # v0.7.11 fix: the WiX source reads $(var.BuildVersion) but this
          # step passed -d Version=... (WIX0150: undefined preprocessor
          # variable). BuildInstaller.bat already passes BuildVersion —
          # match it.
          $version = '${{ github.event.inputs.release-tag || github.ref_name }}' -replace '^v',''
          if ($version -match '^(\d+\.\d+\.\d+)') { $version = $Matches[1] }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.9.$env:GITHUB_RUN_NUMBER" }
          Write-Host "MSI ProductVersion = $version"
          wix build -arch x64 `
            -d PublishDir=publish `
            -d RepoRoot=$env:GITHUB_WORKSPACE `
            -d BuildVersion=$version `
            -out "PrintShopCompanion-$version-x64.msi" `
            installer/PrintShopCompanion.Installer.wxs

      - name: Install smoke (silent install, launch, uninstall, reinstall)
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Phase 9 Stage 7: validate the MSI as a REAL installer on the
          # Windows runner (admin session): silent install, file layout,
          # start-menu shortcut, executable launch (--version), silent
          # uninstall, clean removal, and reinstall (repair path).
          $msi = Get-ChildItem -Path . -Filter 'PrintShopCompanion-*.msi' | Select-Object -First 1
          if (-not $msi) { Write-Error 'MSI not found for install smoke'; exit 1 }
          Write-Host "MSI under test: $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"

          Write-Host '── 1. integrity: Windows Installer can open the package ──'
          $info = Get-ItemProperty -Path $msi.FullName
          if (-not $info) { Write-Error 'MSI unreadable'; exit 1 }

          Write-Host '── 1b. preflight guard (error-1606 authoring pattern) ──'
          # Phase 10: fails the build if a Property/Directory Id collision or
          # a drive-less directory resolution is present (the 1606 root cause).
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/msi-preflight.ps1 -MsiPath $msi.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error 'MSI preflight FAILED'; exit 1 }

          Write-Host '── 2. clean silent install ──'
          $log1 = "$env:GITHUB_WORKSPACE\install-smoke-install.log"
          $p = Start-Process msiexec -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$log1`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content $log1 -Tail 30; Write-Error "silent install failed with exit $($p.ExitCode)"; exit 1 }

          Write-Host '── 3. installed file layout + registration ──'
          # Phase 10: the fixed .wxs resolves INSTALLDIR to the LEAF
          # %ProgramFiles%\PrintShop\Companion (docs/PHASE10_ROOT_CAUSE_1606.md).
          $installDir = "$env:ProgramFiles\PrintShop\Companion"
          if (-not (Test-Path $installDir)) {
            # discover from the installer log
            $installDir = (Select-String -Path $log1 -Pattern 'INSTALLDIR = (.+)$' |
              Select-Object -First 1).Matches[0].Groups[1].Value.Trim()
          }
          if (-not (Test-Path $installDir)) { Write-Error "install directory not found"; exit 1 }
          $exe = Join-Path $installDir 'PrintShopCompanion.exe'
          if (-not (Test-Path $exe)) { Write-Error 'PrintShopCompanion.exe missing after install'; exit 1 }
          $dllCount = (Get-ChildItem $installDir -Filter '*.dll').Count
          Write-Host "installed: exe present, $dllCount DLLs, dir=$installDir"
          if ($dllCount -lt 5) { Write-Error "suspiciously few DLLs ($dllCount) — incomplete install"; exit 1 }
          $startMenu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*PrintShop*' -ErrorAction SilentlyContinue
          Write-Host "start-menu entries: $($startMenu.Count)"
          $upgradeCode = Select-String -Path $log1 -Pattern 'UPGRADECODE = (.+)$' | Select-Object -First 1
          Write-Host "registered in Windows Installer: $($null -ne $upgradeCode)"

          Write-Host '── 4. first launch of the INSTALLED exe (--version) ──'
          $out = & $exe --version 2>&1
          Write-Host "version output: $out"

          Write-Host '── 5. silent uninstall ──'
          $code = (Select-String -Path $log1 -Pattern 'ProductCode = ([{].+[}])' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $p2 = Start-Process msiexec -ArgumentList "/x", "`"$code`"", "/qn", "/norestart", "/l*v", "$env:GITHUB_WORKSPACE\install-smoke-uninstall.log" -PassThru -Wait
          if ($p2.ExitCode -ne 0) { Write-Error "uninstall failed with exit $($p2.ExitCode)"; exit 1 }
          if (Test-Path $exe) { Write-Error 'exe still present after uninstall'; exit 1 }
          Write-Host 'uninstall removed the installation cleanly'

          Write-Host '── 6. reinstallation (repair path) ──'
          $p3 = Start-Process msiexec -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/norestart" -PassThru -Wait
          if ($p3.ExitCode -ne 0) { Write-Error "reinstall failed with exit $($p3.ExitCode)"; exit 1 }
          if (-not (Test-Path $exe)) { Write-Error 'exe missing after reinstall'; exit 1 }
          $p4 = Start-Process msiexec -ArgumentList "/x", "`"$code`"", "/qn", "/norestart" -PassThru -Wait
          if ($p4.ExitCode -ne 0) { Write-Error "final uninstall failed with exit $($p4.ExitCode)"; exit 1 }
          Write-Host "[OK] INSTALL SMOKE PASSED: install, layout, launch, uninstall, reinstall all verified"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintShopCompanion-msi
          path: |
            PrintShopCompanion-*.msi
            install-smoke-*.log
          retention-days: 90
        if: always()

  release:
    name: Create GitHub Release (tag only)
    needs: [build, xaml-audit]
    timeout-minutes: 10
    if: ${{ github.event.inputs.release-tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release-tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Verify the tag exists and points at this commit (no auto-tagging)
        shell: bash
        run: |
          # Stage 6: releases are created ONLY for tags a human pushed after
          # the full verification pipeline was green. CI never creates a tag:
          # if the workflow_dispatch input names a tag that does not exist,
          # or exists at a different commit, fail loudly instead of letting
          # the release action create one implicitly.
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::Tag $TAG does not exist in the repository. Push the tag manually (git push origin $TAG) only after build + tests + XAML audit + startup verification are green; CI never creates tags."
            exit 1
          fi
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")
          if [ "$TAG_SHA" != "${{ github.sha }}" ]; then
            echo "::error::Tag $TAG points at $TAG_SHA, not at this run's commit ${{ github.sha }} — refusing to release a mismatched commit."
            exit 1
          fi
          echo "✓ Tag $TAG exists and matches commit ${{ github.sha }}"

      - name: Check release does not already exist
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Do NOT overwrite an existing release. If a release for this tag
          # already exists, fail with a clear message instead of silently
          # replacing assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Phase 5 fix: an existing release must FAIL the run, not print an
            # annotation and silently succeed with no release created.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::error::Release $TAG already exists. Not overwriting — failing so the operator picks a new tag."
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the build artifact
        if: ${{ steps.check.outputs.exists == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: PrintEXE-win-x64
          path: release-artifacts

      - name: Verify downloaded artifact
        if: ${{ steps.check.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -e
          # The upload put everything under artifacts/, so download lands
          # them at release-artifacts/artifacts/. List and find the ZIP.
          echo "=== release-artifacts/ tree ==="
          find release-artifacts -type f -printf '%p\t%s bytes\n'
          ZIP=$(find release-artifacts -name 'PrintEXE-v*-win-x64.zip' -type f | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::PrintEXE ZIP not found in downloaded artifact"
            exit 1
          fi
          echo "ZIP: $ZIP ($(du -h "$ZIP" | cut -f1))"
          if [ ! -s "$ZIP" ]; then
            echo "::error::ZIP is empty"
            exit 1
          fi
          SUMS=$(find release-artifacts -name 'SHA256SUMS.txt' -type f | head -1)
          if [ -z "$SUMS" ]; then
            echo "::error::SHA256SUMS.txt not found in downloaded artifact"
            exit 1
          fi
          echo "=== SHA256SUMS.txt ==="
          cat "$SUMS"
          # Verify the ZIP checksum matches SHA256SUMS.txt.
          EXPECTED=$(grep "PrintEXE-v.*-win-x64.zip" "$SUMS" | awk '{print $1}')
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch. Expected: $EXPECTED  Actual: $ACTUAL"
            exit 1
          fi
          echo "✓ Checksum verified: $ACTUAL"
          # Phase 6 (updater contract): the portable updater asset MUST be
          # present and byte-identical to the versioned ZIP — the shipped
          # GitHubUpdateService can only download an asset with the literal
          # name "PrintShopCompanion-portable.zip".
          PORTABLE=$(find release-artifacts -name 'PrintShopCompanion-portable.zip' -type f | head -1)
          if [ -z "$PORTABLE" ]; then
            echo "::error::PrintShopCompanion-portable.zip not found in downloaded artifact — the auto-updater (GitHubUpdateService.PortableZipName) could never match this release"
            exit 1
          fi
          PORTABLE_SHA=$(sha256sum "$PORTABLE" | awk '{print $1}')
          if [ "$PORTABLE_SHA" != "$ACTUAL" ]; then
            echo "::error::portable ZIP hash differs from the versioned ZIP — refusing to publish a mismatched updater asset"
            exit 1
          fi
          echo "✓ Updater asset verified: $PORTABLE (sha256 $PORTABLE_SHA)"
          # Stash the absolute paths for the release step (softprops/action-gh-release
          # globs relative to the workspace root).
          echo "ZIP_ABS=$ZIP" >> "$GITHUB_ENV"
          echo "SUMS_ABS=$SUMS" >> "$GITHUB_ENV"
          echo "PORTABLE_ABS=$PORTABLE" >> "$GITHUB_ENV"

      - name: Detect pre-release tag
        id: pre
        shell: bash
        run: |
          # A SemVer suffix after the numeric core (v0.6.1-rc.1) marks a
          # pre-release. GitHub excludes pre-releases from /releases/latest,
          # so the PrintEXE auto-updater (which polls that endpoint) will
          # never offer an RC to stable users — the explicit guard required
          # by the release-gate spec.
          TAG="${{ steps.tag.outputs.tag }}"
          if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ steps.check.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PrintEXE ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.pre.outputs.is_pre == 'true' }}
          body: |
            # PrintEXE ${{ steps.tag.outputs.tag }}

            ## Download

            **`PrintEXE-${{ steps.tag.outputs.tag }}-win-x64.zip`** is the recommended distribution
            (the file name already carries the leading `v` of the tag).

            1. Unzip to a folder (e.g. `C:\PrintEXE\`).
            2. Run `PrintShopCompanion.exe` from inside that folder.
            3. No .NET install required (self-contained).

            ## Verify the download

            ```
            sha256sum PrintEXE-${{ steps.tag.outputs.tag }}-win-x64.zip   # compare with SHA256SUMS.txt
            ```

            ## What's new

            Built from commit ${{ github.sha }} on GitHub Actions run #${{ github.run_number }}.

            > Pre-release note: this build is NOT offered by the in-app
            > auto-updater (pre-releases are excluded from `/releases/latest`).
            > Pre-release users upgrade manually or wait for the next stable tag.

            Architecture: win-x64
            Configuration: Release (self-contained, folder distribution)
            TargetFramework: net10.0-windows
          fail_on_unmatched_files: true
          files: |
            ${{ env.ZIP_ABS }}
            ${{ env.PORTABLE_ABS }}
            ${{ env.SUMS_ABS }}
            release-artifacts/BUILD-INFO.txt
            release-artifacts/README.txt

      - name: Verify release assets match the updater contract
        if: ${{ steps.check.outputs.exists == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Phase 6 regression gate: the published release MUST expose every
          # asset the auto-updater and the human download instructions depend
          # on. A missing asset here means a release users cannot verify or
          # self-update from — fail the run instead of shipping a broken release.
          TAG="${{ steps.tag.outputs.tag }}"
          echo "=== published assets for $TAG ==="
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          MISSING=0
          for required in "PrintEXE-$TAG-win-x64.zip" "PrintShopCompanion-portable.zip" "SHA256SUMS.txt" "README.txt" "BUILD-INFO.txt"; do
            if ! echo "$ASSETS" | grep -qx "$required"; then
              echo "::error::Release $TAG is missing required asset '$required' (updater/download contract violation)"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "✓ Updater contract satisfied: all required assets are present"

name: windows-build

# PrintEXE Windows build, test, package, and release automation.
#
# Triggers:
#   - Pull request targeting main (build + test only; no release)
#   - Push to main (build + test; no release)
#   - Version tag v* (build + test + package + GitHub Release)
#   - Manual workflow_dispatch (build + test; optional release via input)
#
# The workflow does NOT silently ignore failed restore/build/test/publish
# steps. Each stage runs without `continue-on-error` so a failure fails the
# job. The only optional/best-effort steps are SumatraPDF download and
# MSI/bundle signing (which depend on external availability + secrets).
#
# Concurrency: one build per branch/tag at a time; in-progress runs are
# cancelled when a new commit arrives. Tag builds are NOT cancelled (each
# tag deserves a complete release).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Tag to publish as a GitHub Release (e.g. v0.6.0). Leave empty to skip release.'
        required: false
        default: ''

# Least-privilege permissions at workflow level (read-only). The release
# job below declares `contents: write` explicitly.
permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  # Tag pushes are not cancelled — every tag deserves a complete release.
  # Branch/PR pushes cancel in-progress runs on the same ref.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  # Hoisted to job level so step `if:` conditions can read secrets
  # (the `secrets` context is not available inside step `if:`).
  PFX_B64: ${{ secrets.PRINTSHOP_CODE_SIGN_PFX }}
  PFX_PWD: ${{ secrets.PRINTSHOP_CODE_SIGN_PWD }}
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OUTPUT: 'off'

jobs:
  build:
    name: Build, test, package PrintEXE (win-x64)
    runs-on: windows-latest
    # The build job stays least-privilege (read-only). Releases are created
    # by a separate job that depends on this one passing, so a failed
    # build never produces a release.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for version detection + tag lookup

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set BUILD_VERSION from git tag
        shell: pwsh
        run: |
          # Resolve the version string from the git ref.
          # - Tag push (refs/tags/v0.5.5) -> "0.5.5"
          # - workflow_dispatch with release-tag -> that tag
          # - Otherwise (branch push / PR) -> "0.0.<run_number>"
          #
          # Directory.Build.props reads $(BUILD_VERSION) and writes it into
          # <AssemblyVersion>/<FileVersion>, so a v0.5.5 release ships with
          # assembly version 0.5.5.0 and the GitHubUpdateService.IsNewer()
          # check returns false after the update completes.
          #
          # .NET <Version> MUST be a valid System.Version string
          # (major.minor[.build[.revision]]) — no SemVer pre-release suffixes.
          $tag = "${{ github.event.inputs.release-tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $ver = $tag -replace '^v',''
          if (-not ($ver -match '^\d+\.\d+\.\d+')) {
            $ver = "0.0.${{ github.run_number }}"
          }
          Write-Host "Resolved BUILD_VERSION = $ver"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VERSION=$ver" -Encoding utf8NoBOM

      - name: Restore NuGet dependencies
        shell: pwsh
        run: dotnet restore PrintShopCompanion.sln

      - name: Build solution (Release)
        shell: pwsh
        run: dotnet build PrintShopCompanion.sln -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: |
          # No continue-on-error: a failed test MUST fail the build so a
          # broken release is never published. Test results are uploaded
          # as an artifact for inspection.
          # NOTE: --logger "trx;LogFileName=tests.trx" is the only flag
          # needed; the --collector:"XPlat Code Coverage" flag breaks
          # PowerShell arg parsing (the space in "XPlat Code Coverage"
          # splits into two MSBuild switches and MSBuild rejects it with
          # error MSB1001: Unknown switch).
          dotnet test PrintShopCompanion.sln -c Release --no-build `
            --logger "trx;LogFileName=tests.trx"

      - name: Publish app (folder distribution, self-contained, win-x64)
        shell: pwsh
        run: |
          # Folder distribution (NOT single-file) — preserves SQLCipher +
          # SQLite native DLLs alongside the EXE so they load reliably.
          # The App csproj sets SelfContained=false; we override to true
          # so the published ZIP includes the .NET runtime and runs on
          # machines without .NET 10 installed.
          dotnet publish src/PrintShopCompanion.App/PrintShopCompanion.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o ./artifacts/app

      - name: Validate published output
        shell: pwsh
        run: |
          # Verify the publish directory has the EXE + the native
          # dependencies that MUST travel with it. A missing native
          # DLL would crash the app on first SQLCipher call.
          $pub = "$env:GITHUB_WORKSPACE\artifacts\app"
          if (-not (Test-Path $pub)) {
            Write-Error "Publish directory not found: $pub"
            exit 1
          }
          $exe = Join-Path $pub "PrintShopCompanion.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "PrintShopCompanion.exe not found in publish output"
            exit 1
          }
          Write-Host "✓ PrintShopCompanion.exe present"

          # Required native + managed DLLs. SQLCipher and SQLite native
          # libraries come from SQLitePCLRaw.bundle_e_sqlcipher.
          $requiredDlls = @(
            "PrintShopCompanion.dll",
            "PrintShopCompanion.Infrastructure.dll",
            "PrintShopCompanion.Core.dll",
            "Microsoft.Data.Sqlite.dll",
            "SQLitePCLRaw.batteries_v2.dll"
          )
          foreach ($dll in $requiredDlls) {
            if (-not (Test-Path (Join-Path $pub $dll))) {
              Write-Error "Missing required DLL: $dll"
              exit 1
            }
            Write-Host "✓ $dll present"
          }

          # Native SQLite/SQLCipher lib — check by glob (filename includes
          # the runtime ID, e.g. e_sqlcipher.dll or e_sqlite3.dll).
          $nativeCandidates = Get-ChildItem -Path $pub -Filter "e_sql*.dll" -ErrorAction SilentlyContinue
          if (-not $nativeCandidates) {
            Write-Error "Missing native SQLCipher/SQLite DLL (e_sql*.dll) in publish output"
            exit 1
          }
          foreach ($n in $nativeCandidates) { Write-Host "✓ Native: $($n.Name)" }

          # appsettings.json must travel with the EXE (runtime config).
          if (-not (Test-Path (Join-Path $pub "appsettings.json"))) {
            Write-Error "Missing appsettings.json in publish output"
            exit 1
          }
          Write-Host "✓ appsettings.json present"

          # Sanity: no .env, no local DBs, no source files in the publish dir.
          $forbidden = @(
            "*.env", ".env", ".env.*",
            "*.db", "*.db-shm", "*.db-wal", "*.sqlite", "*.sqlite-shm", "*.sqlite-wal",
            "*.pfx", "*.p12", "*.key"
          )
          foreach ($pat in $forbidden) {
            $hits = Get-ChildItem -Path $pub -Filter $pat -ErrorAction SilentlyContinue
            if ($hits) {
              Write-Error "Forbidden file in publish output: $($hits.Name -join ', ')"
              exit 1
            }
          }
          Write-Host "✓ No secrets/databases in publish output"

          # List the publish dir size for the log.
          $size = (Get-ChildItem -Path $pub -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Publish directory size: $([math]::Round($size / 1MB, 2)) MB"

      - name: Package publish directory into PrintEXE-vX.Y.Z-win-x64.zip
        shell: pwsh
        run: |
          $ver = $env:BUILD_VERSION
          $zipName = "PrintEXE-v$ver-win-x64.zip"
          $src = "$env:GITHUB_WORKSPACE\artifacts\app"
          $dst = "$env:GITHUB_WORKSPACE\artifacts\$zipName"
          # Use 7-Zip (pre-installed on windows-latest runners) — preserves
          # file permissions and is faster than Compress-Archive.
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $7z) {
            & $7z a -tzip $dst "$src\*"
          } else {
            Compress-Archive -Path "$src\*" -DestinationPath $dst -Force
          }
          if (-not (Test-Path $dst)) {
            Write-Error "ZIP was not created: $dst"
            exit 1
          }
          $zip = Get-Item $dst
          Write-Host "✓ Created $zipName ($([math]::Round($zip.Length / 1MB, 2)) MB)"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_PATH=$dst" -Encoding utf8NoBOM

      - name: Write version metadata (BUILD-INFO.txt)
        shell: pwsh
        run: |
          $ver = $env:BUILD_VERSION
          $build = "${{ github.run_number }}"
          $commit = "${{ github.sha }}"
          $branch = "${{ github.ref_name }}"
          $built = (Get-Date -Format 'o')
          @"
          PrintEXE build metadata
          =======================
          Version:      $ver
          Build:        $build (GitHub Actions run #${{ github.run_number }})
          Commit:       $commit
          Branch/Tag:   $branch
          Built:        $built
          Architecture: win-x64
          Configuration: Release (self-contained, folder distribution)
          Source:       https://github.com/Arjunyadavsoma/PrintEXE
          "@ | Out-File -Encoding utf8 artifacts/BUILD-INFO.txt
          Get-Content artifacts/BUILD-INFO.txt

      - name: Write README into artifact (installation instructions)
        shell: pwsh
        run: |
          @"
          # PrintEXE v$($env:BUILD_VERSION) - Windows x64 (portable)

          ## Installation
          1. Unzip this archive to a folder, e.g. ``C:\PrintEXE\``.
          2. Run ``PrintShopCompanion.exe`` from inside that folder.
          3. On first launch, sign in to your shop at
             https://printshop-saas-three.vercel.app/shop/login, go to
             Printer Setup -> Register new agent, copy the device token,
             and paste it into PrintEXE's pairing form.
          4. Go to the Printers tab and select your printer.

          ## Requirements
          - Windows 10/11 (x64). No .NET install required (self-contained).
          - A printer installed in Windows.

          ## Auto-update
          PrintEXE checks GitHub Releases on startup. When a new version is
          available, a banner appears; click "Update Now" to download,
          verify SHA-256, and swap the install folder.

          Built from commit ${{ github.sha }}.
          "@ | Out-File -Encoding utf8 artifacts/README.txt
          Get-Content artifacts/README.txt

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          # Checksum the ZIP (the primary artifact) + BUILD-INFO.txt.
          # Format matches the standard ``sha256sum`` output so users can
          # verify with ``sha256sum -c SHA256SUMS.txt`` on any platform.
          $hashes = @()
          $zip = Get-Item $env:ZIP_PATH
          $sha = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          $hashes += "$sha  $($zip.Name)"
          Write-Host "$sha  $($zip.Name)"
          $info = Get-Item artifacts/BUILD-INFO.txt
          $sha2 = (Get-FileHash -Algorithm SHA256 $info.FullName).Hash.ToLower()
          $hashes += "$sha2  $($info.Name)"
          Write-Host "$sha2  $($info.Name)"
          $hashes | Out-File -Encoding ascii artifacts/SHA256SUMS.txt
          Write-Host "SHA256SUMS.txt contents:"
          Get-Content artifacts/SHA256SUMS.txt

      - name: Verify ZIP checksum round-trip
        shell: pwsh
        run: |
          # Re-read the checksum from SHA256SUMS.txt and verify it matches
          # the actual ZIP file. This catches a corrupt ZIP or a typo in
          # the checksum file.
          #
          # The ZIP is always written as the FIRST line of SHA256SUMS.txt
          # (see the Generate step). Take that line and extract the 64-char
          # hex hash before the first space. Avoid regex on the filename
          # (the `.` in PrintEXE-vX.Y.Z-win-x64.zip is a regex meta-char and
          # caused a mismatch in an earlier version).
          $lines = Get-Content artifacts/SHA256SUMS.txt
          $zipLine = $lines | Where-Object { $_ -like "*$env:ZIP_NAME*" } | Select-Object -First 1
          if (-not $zipLine) {
            Write-Error "Could not find $env:ZIP_NAME in SHA256SUMS.txt"
            exit 1
          }
          # The hash is the first 64 chars (SHA-256 hex). Use a literal
          # substring split on the first space, not a regex split.
          $idx = $zipLine.IndexOf(' ')
          if ($idx -lt 64) {
            Write-Error "Malformed checksum line: $zipLine"
            exit 1
          }
          $expected = $zipLine.Substring(0, 64).ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $env:ZIP_PATH).Hash.ToLower()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($expected -ne $actual) {
            Write-Error "Checksum mismatch! Expected: $expected  Actual: $actual"
            exit 1
          }
          Write-Host "✓ Checksum verified: $actual"

      - name: Upload PrintEXE ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintEXE-win-x64
          path: |
            artifacts/${{ env.ZIP_NAME }}
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            artifacts/README.txt
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  # ──────────────────────────────────────────────────────────────────────
  # Release job — runs ONLY on tag pushes (or manual dispatch with a tag).
  # Depends on the build job passing, so a failed build never produces a
  # release. This job has `contents: write` to create the release; the
  # build job is read-only.
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (tag only)
    needs: build
    if: ${{ github.event.inputs.release-tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release-tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Check release does not already exist
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Do NOT overwrite an existing release. If a release for this tag
          # already exists, fail with a clear message instead of silently
          # replacing assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::error::Release $TAG already exists. Not overwriting."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the build artifact
        if: ${{ steps.check.outputs.exists == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: PrintEXE-win-x64
          path: release-artifacts

      - name: Verify downloaded artifact
        if: ${{ steps.check.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -e
          # The upload put everything under artifacts/, so download lands
          # them at release-artifacts/artifacts/. List and find the ZIP.
          echo "=== release-artifacts/ tree ==="
          find release-artifacts -type f -printf '%p\t%s bytes\n'
          ZIP=$(find release-artifacts -name 'PrintEXE-v*-win-x64.zip' -type f | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::PrintEXE ZIP not found in downloaded artifact"
            exit 1
          fi
          echo "ZIP: $ZIP ($(du -h "$ZIP" | cut -f1))"
          if [ ! -s "$ZIP" ]; then
            echo "::error::ZIP is empty"
            exit 1
          fi
          SUMS=$(find release-artifacts -name 'SHA256SUMS.txt' -type f | head -1)
          if [ -z "$SUMS" ]; then
            echo "::error::SHA256SUMS.txt not found in downloaded artifact"
            exit 1
          fi
          echo "=== SHA256SUMS.txt ==="
          cat "$SUMS"
          # Verify the ZIP checksum matches SHA256SUMS.txt.
          EXPECTED=$(grep "PrintEXE-v.*-win-x64.zip" "$SUMS" | awk '{print $1}')
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch. Expected: $EXPECTED  Actual: $ACTUAL"
            exit 1
          fi
          echo "✓ Checksum verified: $ACTUAL"
          # Stash the absolute paths for the release step (softprops/action-gh-release
          # globs relative to the workspace root).
          echo "ZIP_ABS=$ZIP" >> "$GITHUB_ENV"
          echo "SUMS_ABS=$SUMS" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: ${{ steps.check.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PrintEXE ${{ steps.tag.outputs.tag }}
          body: |
            # PrintEXE ${{ steps.tag.outputs.tag }}

            ## Download

            **`PrintEXE-v${{ steps.tag.outputs.tag }}-win-x64.zip`** is the recommended distribution.

            1. Unzip to a folder (e.g. `C:\PrintEXE\`).
            2. Run `PrintShopCompanion.exe` from inside that folder.
            3. No .NET install required (self-contained).

            ## Verify the download

            ```
            sha256sum PrintEXE-v${{ steps.tag.outputs.tag }}-win-x64.zip   # compare with SHA256SUMS.txt
            ```

            ## What's new

            Built from commit ${{ github.sha }} on GitHub Actions run #${{ github.run_number }}.

            Architecture: win-x64
            Configuration: Release (self-contained, folder distribution)
            TargetFramework: net10.0-windows
          fail_on_unmatched_files: true
          files: |
            ${{ env.ZIP_ABS }}
            ${{ env.SUMS_ABS }}
            release-artifacts/BUILD-INFO.txt
            release-artifacts/README.txt
